<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificación de Tareas</title>
    <script
      src="https://kit.fontawesome.com/fd69d3e28d.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <nav class="container">
        <form class="buscador">
          <button type="button" class="btn-buscar" aria-label="Buscar">
            <i class="fa-brands fa-sistrix"></i>
            <input type="text" placeholder="Busca una tarea" />
          </button>
        </form>

        <button
          type="button"
          class="btn-icono"
          aria-label="Abrir calendario"
          onclick="abrirModal()"
        >
          <i class="fa-solid fa-calendar"></i>
        </button>
      </nav>
    </header>

    <div class="layout-principal">
      <main>
        <h2>Saludo</h2>

        
        <section class="filtro-tarea">
            <button type="button" class="btn-filtro active" data-filtro="Todas" >
                Todas
            </button>

            <button type="button" class="btn-filtro" data-filtro="Pendientes" >
                Pendientes
            </button>

            <button type="button" class="btn-filtro" data-filtro="Completadas" >
                Completadas
            </button>
          
        </section>

        
        <section class="lista-tareas">
         
        </section>
      </main>

      
      <aside class="panel-lateral">
        <h3>Resúmen</h3>
        
      </aside>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
